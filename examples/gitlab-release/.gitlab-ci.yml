# Fides release — golden path (EXAMPLE, GitLab CI)
#
# Copy this into your own project's .gitlab-ci.yml. It shows the full Fides flow:
# start a trail -> record provenance -> attach evidence (SBOM, authorship) ->
# change-gate -> approved (manual) deploy -> runtime snapshot.
#
# Configure once (Project -> Settings -> CI/CD -> Variables):
#   FIDES_API_TOKEN   (masked)  — a Fides API token
#   FIDES_SERVER_URL            — e.g. https://fides.example.com
#   FIDES_FLOW_ID             — the flow UUID (`fides flow list`)
#   FIDES_ENV_ID             — (optional) environment UUID to snapshot

stages: [build, gate, deploy]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  FIDES_VERSION: v0.4.0 # `trail start -q` + org-from-token need >= v0.4.0

# Reusable: download the fides CLI onto PATH.
.install_fides: &install_fides
  - apk add --no-cache curl tar
  - |
    base="fides_${FIDES_VERSION}_linux_amd64"
    curl -fsSL "https://github.com/olafkfreund/fides/releases/download/${FIDES_VERSION}/${base}.tar.gz" -o /tmp/f.tgz
    tar -xzf /tmp/f.tgz -C /tmp && cp "/tmp/${base}/fides" /usr/local/bin/fides

build-and-attest:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - *install_fides
    # 1) Trail for this commit; `-q` prints just the id. Export it to later stages.
    - >
      TRAIL_ID=$(fides trail start --flow "$FIDES_FLOW_ID" --trail "$CI_COMMIT_SHA"
      --repository "$CI_PROJECT_URL" --commit "$CI_COMMIT_SHA"
      --branch "$CI_COMMIT_REF_NAME" --committer "$GITLAB_USER_EMAIL" -q)
    - echo "TRAIL_ID=$TRAIL_ID" > trail.env
    # 2) Build + record provenance (org comes from the token).
    - docker build -t "app:$CI_COMMIT_SHA" examples/gitlab-release/app
    - digest=$(docker image inspect "app:$CI_COMMIT_SHA" -f '{{ .Id }}' | sed 's/sha256://')
    - fides artifact report --trail "$TRAIL_ID" --sha256 "$digest" --name app --type docker
    # 3) Evidence: SBOM + code authorship.
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft "app:$CI_COMMIT_SHA" -o cyclonedx-json > sbom.json
    - fides attest sbom --trail "$TRAIL_ID" --artifact-sha "$digest" --file sbom.json
    - fides attest authorship --trail "$TRAIL_ID"
  artifacts:
    reports:
      dotenv: trail.env

# 4) Gate on the change-gate verdict (TRAIL_ID inherited from the dotenv report).
change-gate:
  stage: gate
  image: alpine:3.20
  needs: [build-and-attest]
  script:
    - *install_fides
    - fides change-gate --trail "$TRAIL_ID"

# 5) Deploy — manual, so a human (four-eyes) triggers it.
deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build-and-attest]
  when: manual
  script:
    - *install_fides
    - fides approve --trail "$TRAIL_ID" --role deployer --reason "deployed by CI pipeline $CI_PIPELINE_ID"
    - echo "…your deploy step here…"
    - if [ -n "$FIDES_ENV_ID" ]; then fides snapshot k8s --env "$FIDES_ENV_ID" || echo "snapshot skipped (no cluster access)"; fi
