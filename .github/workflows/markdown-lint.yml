name: markdown-lint

# Lints every tracked markdown file. This used to lint only the files a PR
# touched, because the repo carried a backlog of 434 pre-existing errors and
# gating on all of them would have blocked every PR. The backlog is cleared, so
# the weaker gate is no longer worth its blind spot: changed-files-only never
# catches a file that breaks because a *config* changed, and it silently exempts
# anything nobody happens to edit.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - '.github/workflows/markdown-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.markdownlintignore'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      # git ls-files, not a glob: it lints exactly what is tracked, so it can
      # never wander into node_modules or a build output that .markdownlintignore
      # would otherwise have to keep chasing.
      - name: Lint every tracked markdown file
        run: git ls-files '*.md' -z | xargs -0 -r markdownlint
