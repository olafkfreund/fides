name: Publish images to GHCR

# Publishes the container images to GitHub Container Registry so clusters that
# can't reach the private ECR (e.g. the self-hosted p510 k3d) can pull them, and
# so ArgoCD can auto-update on a new :latest digest. The AWS/EKS path keeps using
# ECR (see go-build.yml); this is additive.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.server"
      - "Dockerfile.reporter"
      - "cmd/**"
      - "pkg/**"
      - "portal/**"
      - "charts/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fides-k8s-reporter
            dockerfile: Dockerfile.reporter
          - image: fides-server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
