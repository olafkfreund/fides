name: Publish images to GHCR

# Publishes the container images to GitHub Container Registry so clusters that
# can't reach the private ECR (e.g. the self-hosted p510 k3d) can pull them.
# The AWS/EKS path keeps using ECR (see go-build.yml); this is additive.
#
# Three steps, in this order (#390 then #389 -- pin, sign, then move the pin):
#   1. build + push  :latest and :<commit sha>
#   2. cosign keyless sign the DIGEST, and verify the signature before promoting
#   3. bump the fides-server pin in factory-gitops so the cluster gets it
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.server"
      - "Dockerfile.reporter"
      - "cmd/**"
      - "pkg/**"
      - "portal/**"
      - "charts/**"
      # The Help page's docs and their screenshots are baked into the image
      # (Dockerfile.server restores web/*.md and stages docs/images under
      # web/docs/). Without these two globs a docs-only merge builds nothing,
      # bumps no pin, and never reaches the running portal -- while GitHub Pages
      # updates as normal, so it looks deployed. That is how #473 shipped to
      # main and not to the cluster.
      #
      # docs/** is deliberately NOT here: docs/*.md are the Pages copies and are
      # not in the image, so rebuilding for them would sign a byte-identical
      # server. Only docs/images is.
      - "web/**"
      - "docs/images/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless via GitHub OIDC (#390)

env:
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_FILE: apps/fides/manifests/manifests.yaml
  # The signer identity the cluster's verify-factory-image-signatures policy
  # will assert at admission. Anchored at both ends and naming the workflow and
  # the ref: the repo prefix alone would accept any workflow on any branch.
  #
  # A workflow_dispatch run from a branch other than main WILL fail the verify
  # step below, because the cert then reads @refs/heads/<branch>. Intended --
  # such an image is denied at admission too.
  #
  # A LITERAL, not a regexp. It was `^https://github\.com/...$` -- anchored at
  # both ends with every dot escaped, which is an exact match written the long
  # way. `fides verify-image --signer` takes an exact SAN (it passes it as
  # sanValue, not sanRegex, to sigstore-go's NewShortCertificateIdentity), so
  # the regexp form would be compared literally -- backslashes, anchors and all
  # -- against the real SAN and could never match. One literal, and both cosign
  # and the Fides verifier assert the same thing the same way.
  SIGNER_IDENTITY: 'https://github.com/${{ github.repository_owner }}/fides/.github/workflows/publish-ghcr.yml@refs/heads/main'
  SIGNER_ISSUER: 'https://token.actions.githubusercontent.com'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel a sibling mid-flight. With fail-fast on, one image's
      # transient push failure cancelled the other job partway through its
      # own publish sequence, which is how an unsigned tag got left behind on
      # 2026-08-13. The two images are independent; a failure in one says
      # nothing about the other, and letting it finish cleanly is strictly
      # better than interrupting it between push and sign.
      fail-fast: false
      matrix:
        include:
          - image: fides-k8s-reporter
            dockerfile: Dockerfile.reporter
          - image: fides-server
            dockerfile: Dockerfile.server
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      # secrets context is not allowed in a step-level `if:`; expose it here so
      # the bump step can gate on env.GITOPS_DEPLOY_KEY instead.
      #
      # A DEPLOY KEY, not a PAT (#395). A PAT carries its owner's reach: the
      # classic token available here has 21 scopes including admin:org,
      # delete_repo and workflow -- and `workflow` alone lets anything holding
      # it rewrite this file. A deploy key is bound to ONE repository and
      # grants nothing anywhere else, which is the entire authority this job
      # needs: push one line to factory-gitops.
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
      # Same reason as above: secrets/vars contexts are not allowed in a
      # step-level `if:`. The flow id is not a credential, so it is a variable.
      FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
      FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
      FIDES_FLOW_ID: ${{ vars.FIDES_FLOW_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push ONLY the immutable :<sha> tag here. `:latest` is moved after the
      # image is signed and the signature verified -- see "Move :latest" below.
      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # CVE gate. Runs AFTER push (it scans the pushed image BY DIGEST -- the
      # artifact that actually ships) but BEFORE signing and before the
      # factory-gitops bump below, so a vulnerable image is never signed and
      # never promoted to a cluster, even though it exists in GHCR.
      #
      # Signing and scanning answer different questions and neither substitutes
      # for the other: a signature says these bytes came from this workflow, and
      # says nothing at all about what is in them.
      #
      # Policy: fixable HIGH/CRITICAL only (`--ignore-unfixed`), `--exit-code 1`
      # to make it a hard gate. Same severity policy as the ECR gate in
      # go-build.yml -- two gates that disagree about what "clean" means are
      # worse than one.
      #
      # NO EXCEPTIONS. This gate used to pass `--skip-files usr/local/bin/kubectl`
      # on the reporter image, and both images used to sit on the EOL alpine:3.18,
      # whose OS-layer CVEs can never have a FixedVersion and so were silently
      # dropped by --ignore-unfixed. Both holes are closed: kubectl is gone from
      # the image (#398, the CLI reads the API server directly) and the base is
      # alpine 3.23 (#399, still receiving updates). Every layer of both images is
      # now scanned at full strength and measures clean.
      #
      # Keep it that way. If a future finding is genuinely unfixable, prefer
      # removing the offending component over adding a skip -- a gate that
      # quietly excludes something reads as "clean" when it is not.
      # ----------------------------------------------------------------------
      - name: Install Trivy
        # Pinned by commit, like gosec: an unpinned scanner changes with no
        # commit here, so its verdict is attributable to nothing in git.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Trivy scan ${{ matrix.image }} (fixable HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "${IMAGE}@${{ steps.build.outputs.digest }}"

      # The gate above drops unfixable findings, which is only safe while the
      # base still receives updates -- on an EOL release nothing is ever
      # "fixable" and a green scan means nothing (#399). Fail loudly if the base
      # goes EOL again rather than letting the gate quietly degrade to a no-op.
      - name: Fail if the base image is EOL
        run: |
          set -euo pipefail
          # Trivy reports EOL as a WARN on stderr, and --quiet SUPPRESSES it, so
          # this must run without --quiet. `2>&1 >/dev/null` keeps only stderr.
          if trivy image --scanners vuln --severity HIGH,CRITICAL \
               "${IMAGE}@${{ steps.build.outputs.digest }}" 2>&1 >/dev/null \
             | grep -qi "no longer supported by the distribution"; then
            echo "::error::${{ matrix.image }} is built on an EOL base; --ignore-unfixed"
            echo "::error::makes the OS layer of the CVE gate blind. Bump the base (#399)."
            exit 1
          fi
          echo "base image is a supported release; OS layer is genuinely covered."

      # ----------------------------------------------------------------------
      # #390 -- cosign keyless signing.
      #
      # Neither image had a signature at all (`crane digest <img>.sig` ->
      # MANIFEST_UNKNOWN), which is the stated blocker on extending the
      # cluster's verify-factory-image-signatures ClusterPolicy past the
      # `factory` namespace to `fides` / `fides-reporter`.
      #
      # Sign the DIGEST, not the tag: signatures are digest-keyed, so one
      # signature covers both :latest and :<sha>, and signing a tag would bind
      # the signature to a pointer that moves.
      # ----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign ${{ matrix.image }} (cosign keyless, Sigstore + GitHub OIDC)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # Not decoration: a signing step that fails open leaves an unverifiable
      # image that looks shipped. Same assertion Kyverno makes at admission,
      # run here at build time so it fails in CI instead of at a deploy.
      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${SIGNER_ISSUER}" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      # ----------------------------------------------------------------------
      # Only NOW move :latest, once these bytes are signed and the signature
      # has been verified.
      #
      # The build step used to push :latest and :<sha> together, which put an
      # unsigned :latest in the registry for the whole scan+sign window. On
      # 2026-08-13 that window was entered for real: the fides-server job hit a
      # transient GHCR "denied" on push, matrix fail-fast cancelled the
      # fides-k8s-reporter job -- which had already pushed :latest but not yet
      # signed it -- and Kyverno then correctly denied every reporter pod for
      # ~25 minutes, because :latest genuinely had no signature.
      #
      # fides-reporter is deployed at image.tag=latest, so :latest is not
      # cosmetic; it is what that workload actually pulls.
      #
      # imagetools create only writes a new tag pointing at the existing
      # manifest -- no rebuild, no layer re-push, and the digest (and therefore
      # the signature) is unchanged.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # An SBOM for the image we just built.
      #
      # Fides requires sbom-cyclonedx evidence from its users' builds -- SOC2
      # CC7.2, NIST SR-4, DORA third-party and ISO A.14.2.5 all resolve to it --
      # and until now produced none for itself. An auditor notices that, and so
      # does anyone evaluating the product.
      #
      # Generated FROM THE PUSHED DIGEST, not from the working tree: the source
      # directory contains node_modules and CI fixtures that never ship, and an
      # SBOM listing 13,000 components that are not in the artifact describes
      # something other than what runs.
      #
      # Attached to the image as a cosign attestation so a consumer can fetch it
      # from the registry with the artifact rather than trusting a link.
      # ----------------------------------------------------------------------
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Generate the SBOM for ${{ matrix.image }}
        run: |
          set -euo pipefail
          syft "${IMAGE}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json="sbom-${{ matrix.image }}.json" -q
          n=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('components',[])))" \
                "sbom-${{ matrix.image }}.json")
          echo "SBOM: ${n} components"
          # An SBOM with nothing in it would satisfy the control while proving
          # nothing, which is worse than not producing one.
          [ "${n}" -gt 0 ] || { echo "::error::the SBOM is empty"; exit 1; }

      - name: Attach the SBOM to the image
        run: |
          cosign attest --yes --predicate "sbom-${{ matrix.image }}.json" \
            --type cyclonedx "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Publish the SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.json

      - name: Move :latest to the signed digest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" "${IMAGE}@${{ steps.build.outputs.digest }}"
          now="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          if [ "${now}" != "${{ steps.build.outputs.digest }}" ]; then
            echo "::error::${IMAGE}:latest is ${now}, expected ${{ steps.build.outputs.digest }}"
            exit 1
          fi
          echo ":latest -> ${now} (signed)"

      # ----------------------------------------------------------------------
      # #389 -- tell the cluster the image exists.
      #
      # factory-gitops#162 moved p510 off `:latest` onto an immutable commit tag
      # and deleted the 30-minute `kubectl rollout restart` CronJob that used to
      # be the deploy mechanism. Nothing has moved that pin since, so a merge to
      # main reached the cluster NEVER. This is the missing third step.
      #
      # fides-server only: fides-reporter is deployed from the chart in this
      # repo at targetRevision main with image.tag=latest, so it is not pinned
      # and not stuck.
      # ----------------------------------------------------------------------
      - name: Assert the pushed tag resolves to the image we built
        if: matrix.image == 'fides-server'
        run: |
          set -euo pipefail
          # The pin below names a TAG, so pin the tag we can prove is these
          # bytes rather than a sha reassembled independently of the push.
          pushed="$(docker buildx imagetools inspect "${IMAGE}:${{ github.sha }}" \
                      --format '{{.Manifest.Digest}}')"
          built="${{ steps.build.outputs.digest }}"
          if [ "${pushed}" != "${built}" ]; then
            echo "::error::${IMAGE}:${{ github.sha }} is ${pushed}, but this run built ${built}"
            exit 1
          fi
          echo "tag ${{ github.sha }} == built digest ${built}"

      # ----------------------------------------------------------------------
      # Record this build in Fides itself.
      #
      # Fides did not eat its own dog food: this pipeline built, scanned,
      # signed and deployed images while recording NO provenance into Fides.
      # The p510 environment therefore held 2 artifacts, both from the day it
      # was deployed (2026-07-31) and both long superseded, against ~80 running
      # containers — so 1529 consecutive runtime snapshots reported
      # `compliant: false` and could never report anything else. A verdict that
      # is always red carries exactly as much information as one that is always
      # green.
      #
      # Placed AFTER the CVE gate, the EOL gate and cosign signing, so a digest
      # only ever enters the evidence vault once it has passed everything. The
      # trail carries the commit metadata the segregation-of-duties attestation
      # reads (committer), so SoD has something to evaluate.
      #
      # Trail name includes the image because the two matrix jobs run in
      # parallel and trails are UNIQUE(flow_id, name) — one trail per commit
      # would have the second job race the first into a 409.
      #
      # Inert until configured: needs variable FIDES_SERVER_URL and secret FIDES_API_TOKEN
      # and variable FIDES_FLOW_ID. Same opt-in shape as the deploy key below.
      # ----------------------------------------------------------------------
      # Build the CLI from THIS commit rather than installing a release.
      #
      # setup-fides downloads the latest published release, which is a
      # different version of Fides from the one this run is building. That skew
      # broke the pipeline on 2026-08-14: `verify-image --image` had merged to
      # main (#407) but was in no release yet, so the released binary exited
      # with "flag provided but not defined: -image" and took the platform
      # digest registration and the factory-gitops bump down with it.
      #
      # setup-fides is right for CONSUMERS of Fides, who should pin a release.
      # It is wrong here: this repo IS Fides, so recording a build with a stale
      # binary means the pipeline can only ever use features from before the
      # code it is currently shipping. Building from source makes the CLI and
      # the artifact it describes the same version by construction.
      - name: Set up Go (to build the CLI)
        if: env.FIDES_API_TOKEN != '' && env.FIDES_SERVER_URL != '' && env.FIDES_FLOW_ID != ''
        uses: actions/setup-go@v5
        with:
          # Same pin as go-build.yml: the govulncheck gate there is the reason
          # the version is pinned at all, and two Go versions in one repo is a
          # difference nobody wants to debug later.
          go-version: '1.26.6'
          check-latest: true

      - name: Build the fides CLI from this commit
        if: env.FIDES_API_TOKEN != '' && env.FIDES_SERVER_URL != '' && env.FIDES_FLOW_ID != ''
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/fides" ./cmd/cli
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Record ${{ matrix.image }} provenance in Fides
        if: env.FIDES_API_TOKEN != '' && env.FIDES_SERVER_URL != '' && env.FIDES_FLOW_ID != ''
        env:
          # Every interpolation goes through the environment, never inline into
          # the script. COMMITTER especially: a commit author sets their own
          # email, so inlining it is a script-injection hole (actionlint flags
          # this one by name).
          COMMITTER: ${{ github.event.head_commit.author.email }}
          # A re-dispatch of an already-published SHA gets its own trail.
          #
          # trails is UNIQUE(flow_id, name), so on a push run this name is the
          # commit and re-running the workflow by hand hit that constraint: the
          # step died in ~0.6s with no output, which reads as an infrastructure
          # fault rather than a duplicate. Before docs paths were added to the
          # trigger it never bit, because a hand-dispatch was usually the only
          # run for that SHA.
          #
          # A second trail is also the more accurate record. As the comment
          # below notes, a rebuild produces a NEW index digest even when the
          # content is identical, so the re-dispatch really did publish a
          # different artifact and it should not be filed under the first one.
          #
          # Push runs keep the bare <sha>-<image> name, so nothing changes for
          # the path that runs on every merge.
          TRAIL_NAME: ${{ github.sha }}-${{ matrix.image }}${{ github.event_name == 'workflow_dispatch' && format('-run{0}.{1}', github.run_id, github.run_attempt) || '' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trail_id="$(fides trail start \
            --flow "${FIDES_FLOW_ID}" \
            --trail "${TRAIL_NAME}" \
            --repository "${REPO_URL}" \
            --commit "${COMMIT_SHA}" \
            --committer "${COMMITTER}" \
            --quiet)"
          echo "trail ${trail_id}"
          # Report the digest by value: this is the artifact the gate scanned
          # and cosign signed, not a tag that could be re-pointed later.
          fides artifact report \
            --trail "${trail_id}" \
            --sha256 "${DIGEST#sha256:}" \
            --name "${IMAGE_NAME}" \
            --type docker
          echo "recorded ${IMAGE_NAME} index ${DIGEST}"

          # Record our own SBOM into our own product.
          #
          # This is the whole argument in one command: the evidence Fides asks
          # every user to produce, produced by Fides' own build, recorded through
          # Fides' own CLI, and gating Fides' own releases. A compliance tool
          # that cannot show its own compliance is asking for trust it has not
          # demonstrated.
          #
          # It also means SOC2-CC7.2 / NIST-SR-4 / DORA-THIRD-PARTY are
          # genuinely satisfied for this artifact rather than asserted.
          fides attest sbom \
            --trail "${trail_id}" \
            --artifact-sha "${DIGEST#sha256:}" \
            --name "sbom" \
            --file "sbom-${IMAGE_NAME}.json"
          echo "recorded SBOM evidence for ${IMAGE_NAME}"

          # Also record the per-platform manifest digests.
          #
          # steps.build.outputs.digest is the INDEX digest, and the index
          # carries a SLSA provenance attestation that embeds the commit — so
          # a rebuild whose image content is byte-identical still gets a NEW
          # index digest. containerd, which already holds that content, keeps
          # reporting the index digest it first resolved. The runtime snapshot
          # then sees a digest CI never registered and calls it a shadow
          # change, forever.
          #
          # Observed on 2026-08-13: tags 6f5848c3 and 09157f3c differ only in
          # workflow YAML, so both indexes wrap the SAME amd64 manifest
          # (dd510945...) while their index digests differ. The pod reported
          # the older index and stayed a shadow despite the build being
          # registered.
          #
          # The platform manifest digest is the image content, so it is stable
          # across content-identical rebuilds. Registering both means whichever
          # one a runtime reports is known to Fides.
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq -r '.manifests[]? | select(.platform.os != "unknown") | .digest' \
            | while read -r child; do
                [ -n "${child}" ] || continue
                fides artifact report \
                  --trail "${trail_id}" \
                  --sha256 "${child#sha256:}" \
                  --name "${IMAGE_NAME}" \
                  --type docker
                echo "recorded ${IMAGE_NAME} platform ${child}"
              done

          # Verify the signature AGAIN, with Fides' own verifier, and record the
          # verdict as a cosign-verification attestation.
          #
          # The `cosign verify` self-test above already gates the build, so this
          # is not a second opinion on whether the image is signed -- it is the
          # difference between a fact that lives in a CI log for 90 days and a
          # fact that lives in the evidence vault. "Was this image's signature
          # verified, against which identity?" is an audit question, and the
          # only answer used to be a green tick in a job someone had to still
          # be able to find.
          #
          # It is also the only place #407's registry resolution runs for real:
          # no --bundle here, so the signature is discovered from GHCR via
          # cosign's <repo>:sha256-<digest>.sig convention, exactly as a third
          # party verifying our images would have to do it.
          #
          # LAST in this step, deliberately. It is a gate, and a gate placed
          # before the recording it guards destroys the very evidence it exists
          # to certify: on 2026-08-14 this call sat above the platform-digest
          # loop, failed, and took both that loop and the factory-gitops bump
          # with it -- undoing #420 and stopping CD, over a verification
          # question that has no bearing on whether the digests are worth
          # recording. Record everything first, then gate.
          #
          # Non-zero on an unverified image (exit 2), so this still fails the
          # build rather than filing a "verified: false" attestation quietly.
          fides verify-image \
            --sha256 "${DIGEST#sha256:}" \
            --image "${IMAGE}" \
            --signer "${SIGNER_IDENTITY}" \
            --issuer "${SIGNER_ISSUER}" \
            --trail "${trail_id}"

      - name: Note if provenance recording is not wired
        if: env.FIDES_API_TOKEN == '' || env.FIDES_SERVER_URL == '' || env.FIDES_FLOW_ID == ''
        run: |
          echo "::warning::Fides recorded NO provenance for this build — its own"
          echo "::warning::runtime environments cannot be compliant without it."
          echo "::notice::Set variable FIDES_SERVER_URL and secret FIDES_API_TOKEN, and"
          echo "::notice::variable FIDES_FLOW_ID, to enable. See issue #417."

      # The key never reaches the filesystem outside this job's runner, and it
      # is written 0600 to a path only this step and the next know. `ssh-agent`
      # was avoided deliberately: it leaves the key live for every later step
      # in the job, whereas GIT_SSH_COMMAND scopes it to the git calls that
      # need it.
      - name: Load the factory-gitops deploy key
        if: matrix.image == 'fides-server' && env.GITOPS_DEPLOY_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${GITOPS_DEPLOY_KEY}" > ~/.ssh/gitops_deploy
          chmod 600 ~/.ssh/gitops_deploy

          # Prove the key SURVIVED transport before blaming the far end. A
          # secret that lost its newlines, or got truncated, fails at the
          # handshake with the same "did not authenticate" as a key that was
          # never authorised -- two very different faults, one message.
          #
          # `ssh-keygen -y` derives the PUBLIC half, so this is safe to print:
          # it reveals nothing the deploy key entry on factory-gitops does not
          # already publish, and it is the only local check that the private
          # key is well-formed.
          if ! ssh-keygen -y -f ~/.ssh/gitops_deploy > /tmp/derived.pub 2>/tmp/keyerr; then
            echo "::error::GITOPS_DEPLOY_KEY is not a usable private key -- it did not"
            echo "::error::survive transport into the runner, or is not a private key at all."
            echo "::error::ssh-keygen said: $(tr -d '\n' < /tmp/keyerr)"
            echo "::error::(wrote $(wc -l < ~/.ssh/gitops_deploy) lines; an ed25519 key is 8)"
            exit 1
          fi
          echo "key parsed: $(ssh-keygen -lf /tmp/derived.pub)"
          # Pin github.com's host key rather than accept-new: a first-contact
          # TOFU accept on a fresh runner trusts whatever answers, every time.
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          # `git@github.com` always exits 1 (it refuses a shell), so the exit
          # code says nothing -- the banner is the only signal. Checked here so
          # a bad key fails with that message instead of surfacing as a
          # confusing clone error five lines later.
          # Capture rather than `| grep -q`: piping straight into grep SWALLOWS
          # ssh's own explanation, which is the only thing that distinguishes
          # "key not authorised" from "host key mismatch" from "network". The
          # first cut of this step did exactly that and the failure was
          # unattributable.
          set +e
          out="$(ssh -i ~/.ssh/gitops_deploy -o IdentitiesOnly=yes \
                     -o BatchMode=yes -T git@github.com 2>&1)"
          set -e
          if printf '%s' "$out" | grep -q "successfully authenticated"; then
            echo "deploy key authenticated: $(printf '%s' "$out" | head -1)"
          else
            echo "::error::the GITOPS_DEPLOY_KEY secret did not authenticate to github."
            echo "::error::Check it is the PRIVATE half of a WRITE deploy key on ${GITOPS_REPO}."
            echo "--- ssh said ---"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Bump fides-server pin in factory-gitops
        if: matrix.image == 'fides-server' && env.GITOPS_DEPLOY_KEY != ''
        env:
          # Scoped to the git calls below. IdentitiesOnly stops ssh offering any
          # other key the runner might have and getting rejected first.
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/gitops_deploy -o IdentitiesOnly=yes"
          # for the `gh api compare` ancestry check below
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"

          # Every service in the fleet bumps this same repo, so two deploys in
          # flight race on push (Factory#527). Retry the whole cycle from a
          # fresh clone rather than rebasing: the edit is idempotent and this
          # preserves the rival's commit instead of force-pushing over it.
          pushed=""
          for attempt in 1 2 3 4 5; do
            rm -rf gitops
            git clone --quiet --depth 1 "git@github.com:${GITOPS_REPO}.git" gitops
            cd gitops

            # Never move the pin BACKWARDS. Two runs racing on push both write
            # this file and the last writer wins regardless of age: on
            # 2026-08-20 an older run (1066a12) finished 43s after a newer one
            # (ddd21c2) and reverted the cluster to the earlier build. The retry
            # below does not help -- it handles a *rejected* push, and here both
            # pushes succeed.
            #
            # compare/{base}...{head} reports "behind" when head is an ancestor
            # of base, i.e. exactly when our SHA is older than what is pinned.
            # Anything else (ahead, identical, diverged, or an API hiccup) falls
            # through and bumps as before: the only case worth blocking is the
            # one that demonstrably regressed a cluster.
            current="$(sed -nE "s|.*image: ${IMAGE}:([0-9a-f]{40}).*|\1|p" "${GITOPS_FILE}" | head -1)"
            if [ -n "$current" ] && [ "$current" != "${SHA}" ]; then
              rel="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current}...${SHA}" \
                       --jq .status 2>/dev/null || echo unknown)"
              if [ "$rel" = "behind" ]; then
                echo "::notice::pinned ${current} is newer than ${SHA}; leaving it alone."
                pushed="declined"
                break
              fi
              echo "pin ${current} -> ${SHA} (${rel})"
            fi

            sed -i -E "s|(image: ${IMAGE}):.*|\1:${SHA}|" "${GITOPS_FILE}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if git diff --quiet; then
              # Two very different cases that a bare "nothing to do" would
              # conflate: already pinned (fine) versus the sed matched nothing
              # (a broken bump reporting success).
              if grep -q "image: ${IMAGE}:${SHA}" "${GITOPS_FILE}"; then
                echo "already pinned to ${SHA}; nothing to do."
                pushed="already"
                break
              fi
              echo "::error::the image edit changed nothing AND the pin is not ${SHA}."
              echo "::error::The sed pattern no longer matches ${GITOPS_FILE}."
              exit 1
            fi

            git commit --quiet -am "cd(fides): ${SHA} [skip ci]"
            if git push --quiet; then
              pushed="yes"
              break
            fi
            echo "push rejected (attempt ${attempt}/5) - another service bumped first; retrying"
            cd "$GITHUB_WORKSPACE"
            sleep $(( attempt * 3 ))
          done

          if [ -z "$pushed" ]; then
            echo "::error::could not push the image bump after 5 attempts (Factory#527)."
            exit 1
          fi

          if [ "$pushed" = "declined" ]; then
            echo "pin left at a newer commit; nothing to verify."
            exit 0
          fi

          # A deploy that cannot prove the pin moved must not report success.
          # Re-read from the remote rather than trusting the push.
          cd "$GITHUB_WORKSPACE"
          rm -rf gitops-verify
          git clone --quiet --depth 1 "git@github.com:${GITOPS_REPO}.git" gitops-verify
          if grep -q "image: ${IMAGE}:${SHA}" "gitops-verify/${GITOPS_FILE}"; then
            echo "verified: ${GITOPS_REPO} pins fides-server at ${SHA}"
          else
            echo "::error::pushed, but ${GITOPS_REPO} does not pin fides-server at ${SHA}."
            exit 1
          fi

      - name: Note if CD is not wired
        if: matrix.image == 'fides-server' && env.GITOPS_DEPLOY_KEY == ''
        run: |
          echo "::notice::Image pushed and signed, but GITOPS_DEPLOY_KEY is unset so"
          echo "::notice::nothing moved the cluster pin -- this merge deploys nowhere (#389)."
          echo "::notice::Fix: add a WRITE deploy key to ${GITOPS_REPO} and store its"
          echo "::notice::private half as GITOPS_DEPLOY_KEY on ${{ github.repository }}:"
          echo "::notice::  ssh-keygen -t ed25519 -f k -N '' -C 'fides CD'"
          echo "::notice::  gh api -X POST repos/${GITOPS_REPO}/keys -f title='fides CD' \\"
          echo "::notice::    -f key=\"\$(cat k.pub)\" -F read_only=false"
          echo "::notice::  gh secret set GITOPS_DEPLOY_KEY --repo ${{ github.repository }} < k"
          echo "::notice::Until then, hand-edit ${GITOPS_FILE} to :${{ github.sha }}"
