name: Go Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin the patched toolchain: go1.26.6 fixes 7 stdlib advisories reached by
          # this code (encoding/asn1 GO-2026-5972 via cosignverify+tsa, net/http
          # GO-2026-5026, encoding/xml via evidence.ParseJUnit, among others).
          # (govulncheck gate). Bump as newer stdlib advisories land.
          go-version: '1.26.6'
          check-latest: true

      # 430 findings when this was first switched on; the sweep that cleared them
      # fixed real bugs, most importantly 68 unchecked rows.Err() calls -- each one
      # a place where a failed read returned a short list that looked like a
      # legitimate result. In compliance data that is the worst possible failure
      # mode, so this gate exists to stop it coming back.
      # A short fuzz run on every PR. Not to find new bugs in 20 seconds a
      # target -- that is what a long local run is for -- but so that a change
      # making a parser panic on malformed input fails here, not in production.
      #
      # These parsers eat third-party scanner output and webhook bodies. A panic
      # in one is a denial of service on every pipeline that asks Fides for a
      # release verdict. Any crasher go test finds is written to testdata/ and
      # becomes an ordinary regression test from then on.
      - name: Fuzz the untrusted-input parsers
        run: |
          set -euo pipefail
          fuzz() {
            echo "--- $2"
            # Bounded by EXECUTIONS, not seconds. -fuzztime=20s made this step
            # flaky: on a loaded runner the coordinator hits its own deadline
            # shutting workers down and reports "context deadline exceeded",
            # which is not a crash and writes no crasher, but fails the build.
            # A flaky gate is worse than no gate -- people start re-running it
            # without reading it. An execution count is the same amount of work
            # regardless of how fast the machine is.
            go test "$1" -run "^$2\$" -fuzz "^$2\$" -fuzztime=500000x
          }
          fuzz ./pkg/evidence FuzzParseSBOM
          fuzz ./pkg/evidence FuzzParseJUnit
          fuzz ./pkg/evidence FuzzParseTrivy
          fuzz ./pkg/evidence FuzzParseSARIF
          fuzz ./pkg/evidence FuzzParseSLSA
          fuzz ./pkg/evidence FuzzParseSnyk
          fuzz ./pkg/evidence FuzzParseDispatch
          fuzz ./pkg/evidence FuzzNormalizeProvenance
          fuzz ./pkg/inbound FuzzVerify
          fuzz ./pkg/inbound FuzzParsePush

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Verify dependencies
        run: go mod verify

      - name: Vet code
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Guard against shipping a corrupted frontend build: every committed
      # Next.js chunk must parse as valid JavaScript. A broken chunk crashes the
      # whole portal (blank page) even though the server stays healthy.
      - name: Validate web build (JS chunks parse)
        run: |
          shopt -s nullglob
          fail=0
          for f in web/_next/static/chunks/*.js web/_next/static/chunks/**/*.js; do
            node --check "$f" || { echo "BROKEN CHUNK: $f"; fail=1; }
          done
          exit $fail

      - name: Run Tests
        run: |
          set -o pipefail
          go test -race -json ./... | tee gotest.jsonl

      # Record the unit-test result on the Fides trail as a `test-result`
      # attestation (payload: passed/failed/skipped/total) — the same tamper-
      # evident chain the portal CR "Tests" tab and ServiceNow u_fides_test_result
      # mirror read back. Trail keyed by commit sha, flow from FIDES_FLOW_ID.
      # always() so a failing suite still records compliant=false. Inert until
      # the FIDES secrets/vars are set.
      - name: Attest test results to Fides
        if: ${{ always() }}
        env:
          FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          FIDES_FLOW_ID: ${{ vars.FIDES_FLOW_ID }}
          TRAIL_NAME: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${FIDES_API_TOKEN}" ] && [ -n "${FIDES_SERVER_URL}" ] && [ -n "${FIDES_FLOW_ID}" ] || { echo "Fides not configured; skipping"; exit 0; }
          [ -f gotest.jsonl ] || { echo "no gotest.jsonl; skipping"; exit 0; }
          base="${FIDES_SERVER_URL%/}/api/v1"
          auth="Authorization: Bearer ${FIDES_API_TOKEN}"

          # Say WHICH part of the configuration is wrong. This step used to be
          # a chain of `curl -sf`, so every misconfiguration surfaced as
          # "exit code 22" and took an hour of cluster archaeology to place.
          # All three of these have actually been wrong: the flow id pointed at
          # a flow that did not exist, the token was stale, and the URL embeds
          # a load balancer address that moves.
          probe="$(curl -s -o /tmp/flows.json -w '%{http_code}' --max-time 20 \
                    -H "$auth" "$base/flows" || echo 000)"
          case "$probe" in
            200) ;;
            000) echo "::error::cannot reach $base — is FIDES_SERVER_URL current? The demo ingress" \
                      "hostname embeds the load balancer address, so it changes when that does."; exit 1 ;;
            401|403) echo "::error::Fides rejected the CI credential (HTTP $probe) — FIDES_API_TOKEN" \
                          "no longer matches the server's."; exit 1 ;;
            *) echo "::error::unexpected HTTP $probe from $base/flows"; exit 1 ;;
          esac

          # Membership of /flows, not a GET on the flow itself: asking for a
          # flow that does not exist answers 200 with an empty list, exactly
          # like a flow that exists and has no trails yet. That is what let a
          # FIDES_FLOW_ID pointing at nothing survive from 2026-08-13 until it
          # finally failed three curls later as "exit code 22".
          if ! jq -e --arg f "$FIDES_FLOW_ID" 'any(.[]?; .id == $f)' /tmp/flows.json >/dev/null; then
            echo "::error::flow $FIDES_FLOW_ID is not one this token can see. Flows available:" \
                 "$(jq -r '[.[]?|"\(.name)=\(.id)"]|join(", ")' /tmp/flows.json)"
            exit 1
          fi

          trail_id="$(curl -sf -H "$auth" "$base/flows/${FIDES_FLOW_ID}/trails" | jq -r --arg n "$TRAIL_NAME" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          if [ -z "${trail_id:-}" ] || [ "$trail_id" = "null" ]; then
            trail_id="$(curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/trails" \
              -d "$(jq -n --arg f "$FIDES_FLOW_ID" --arg n "$TRAIL_NAME" --arg c "$COMMIT_SHA" --arg r "$REPO_URL" \
                    '{flow_id:$f,name:$n,git_commit:$c,git_repository:$r}')" | jq -r '.id')"
          fi
          P=$(jq -rs 'map(select(.Test!=null and .Action=="pass"))|length' gotest.jsonl)
          F=$(jq -rs 'map(select(.Test!=null and .Action=="fail"))|length' gotest.jsonl)
          Sk=$(jq -rs 'map(select(.Test!=null and .Action=="skip"))|length' gotest.jsonl)
          Tt=$((P + F + Sk))
          if [ "$F" = "0" ]; then C=true; else C=false; fi
          payload="$(jq -nc --argjson c "$C" --argjson p "$P" --argjson f "$F" --argjson s "$Sk" --argjson t "$Tt" \
            '{compliant:$c,passed:$p,failed:$f,skipped:$s,total:$t,suite:"fides go test"}')"
          curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/attestations" \
            -d "$(jq -n --arg tid "$trail_id" --arg pl "$payload" \
                  '{trail_id:$tid,name:"unit-tests",type_name:"test-result",payload:$pl}')" >/dev/null
          echo "attested test-result on trail $trail_id: passed=$P failed=$F skipped=$Sk total=$Tt"

      # PINNED, not @latest. An unpinned scanner changes without a commit, so a
      # scan verdict is not attributable to anything in git, and an upstream
      # release can turn CI red with no change from us. Bump deliberately.
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      # gosec BLOCKS the pipeline at medium+ severity. All findings up to this
      # bar are resolved: real ones fixed (e.g. 0750 dir perms), and the genuine
      # false-positives annotated with justified `#nosec` (guarded storage paths,
      # the allowlisted MCP exec, the bounded multipart parse, the configured MCP
      # server URL, CLI opening user-specified files). New medium+ findings fail CI.
      #
      # Pinned by COMMIT rather than @master or a tag. `@master` ran whatever
      # upstream last pushed -- new third-party code executing inside the
      # security gate itself, with no commit here to attribute it to, and an
      # upstream push able to turn CI red on its own. A tag is only slightly
      # better: it is mutable and can be repointed. This is v2.28.0.
      - name: Static security analysis (gosec)
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: -severity medium -confidence high ./...

  rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fides
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fides"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          check-latest: true

      # Proves the Postgres RLS policies (schema-rls.sql) enforce tenant
      # isolation: pkg/db verifies ScopedConn directly, and pkg/api runs an
      # end-to-end HTTP test with RLS enabled. -p 1 serializes the two packages
      # since they share the database.
      - name: RLS + events integration + E2E tests
        env:
          FIDES_TEST_DB_DSN: host=127.0.0.1 port=5432 user=postgres password=test dbname=fides sslmode=disable
        run: go test -p 1 ./pkg/db/ ./pkg/api/ ./pkg/events/ ./pkg/servicenow/ -run 'Integration|EndToEnd' -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, rls-integration]
    # Only the canonical repo deploys — the synechron/Fides mirror has no trusted
    # OIDC role, so this job would fail there. Guard on the repository so the
    # mirror's push builds/tests but skips deploy.
    if: github.repository == 'olafkfreund/fides' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # required for GitHub OIDC -> AWS role assumption
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Assume the deploy IAM role via GitHub OIDC — no stored AWS keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Pinned by commit, like gosec: an unpinned scanner changes with no commit
      # here, so its verdict is attributable to nothing in git.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Build image for Amazon ECR
        env:
          ECR_REGISTRY: 796973489124.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: fides-server
        run: |
          # Tag by commit SHA (immutable, reproducible) and also move :latest.
          docker build -f Dockerfile.server \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # Scan BEFORE the push, not after: this is the production EKS path, and a
      # vulnerable image should never reach the registry at all, let alone the
      # cluster. Same bytes either way -- the push below uploads exactly what
      # was scanned here.
      #
      # Flags are identical to the GHCR gate in publish-ghcr.yml. Two gates that
      # disagree about what "clean" means are worse than one.
      - name: Trivy scan the image (fixable HIGH/CRITICAL) — blocks the deploy
        env:
          ECR_REGISTRY: 796973489124.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: fides-server
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      # --ignore-unfixed above is only safe while the base still receives
      # updates: on an EOL release nothing is ever "fixable", so the OS layer
      # silently stops being gated and a green scan means nothing (#399).
      # Mirrors the identical check in publish-ghcr.yml.
      - name: Fail if the base image is EOL
        env:
          ECR_REGISTRY: 796973489124.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: fides-server
        run: |
          set -euo pipefail
          # Trivy reports EOL as a WARN on stderr, and --quiet SUPPRESSES it, so
          # this must run without --quiet. `2>&1 >/dev/null` keeps only stderr.
          if trivy image --scanners vuln --severity HIGH,CRITICAL \
               "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" 2>&1 >/dev/null \
             | grep -qi "no longer supported by the distribution"; then
            echo "::error::built on an EOL base; --ignore-unfixed makes the OS"
            echo "::error::layer of the CVE gate blind. Bump the base (#399)."
            exit 1
          fi
          echo "base image is a supported release; OS layer is genuinely covered."

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: 796973489124.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: fides-server
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name sarc-aws --region eu-west-2

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: 796973489124.dkr.ecr.eu-west-2.amazonaws.com
          ECR_REPOSITORY: fides-server
        run: |
          kubectl apply -f kubernetes/fides-deploy.yaml
          # Pin the Deployment to the exact image built here and wait for the
          # rollout, so a new build always rolls out (a plain apply of an
          # unchanged :latest manifest would not restart the pods).
          kubectl -n fides set image deployment/fides-server \
            app=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          kubectl -n fides rollout status deployment/fides-server --timeout=240s
