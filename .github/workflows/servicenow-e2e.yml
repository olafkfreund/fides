name: ServiceNow live e2e

# The unit tests in pkg/servicenow run against an httptest mock, and a mock
# accepts whatever it is sent. That is how a CMDB payload ServiceNow rejected in
# full shipped green for months: IRE answers HTTP 200 with the rejections buried
# in the body, so every layer above reported success.
#
# This workflow is the counterweight. It drives the surfaces against a real
# instance and verifies each by reading the record back through ServiceNow's own
# Table API. It cannot run on pull requests: it needs credentials forks must not
# have, and it writes to a shared instance, so it runs on a schedule and on
# demand instead.

on:
  schedule:
    # Weekly, Monday 07:00 UTC — before the working week, so a ServiceNow-side
    # change (a renamed choice, a revoked role, a plugin deactivated) surfaces
    # as an alert rather than as a customer noticing the CMDB stopped updating.
    - cron: '0 7 * * 1'
  workflow_dispatch:

# One at a time: concurrent runs would race on the shared instance and on the
# CIs they assert about.
concurrency:
  group: servicenow-e2e
  cancel-in-progress: false

# Read-only: the only thing this workflow needs the token for is the checkout.
# Everything it writes to, it writes to ServiceNow with ServiceNow credentials.
permissions:
  contents: read

jobs:
  e2e:
    name: Drive every ServiceNow surface and read it back
    runs-on: ubuntu-latest
    # Skipped automatically on forks, which have none of these secrets.
    if: github.repository_owner == 'olafkfreund'
    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials are present
        id: creds
        env:
          FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          SN_URL: ${{ secrets.SN_URL }}
          SN_USER: ${{ secrets.SN_USER }}
          SN_PASS: ${{ secrets.SN_PASS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Secrets cannot be read in a step-level `if:`, so gate on an output.
          missing=""
          [ -n "$FIDES_SERVER_URL" ] || missing="$missing FIDES_SERVER_URL(var)"
          [ -n "$FIDES_API_TOKEN" ]  || missing="$missing FIDES_API_TOKEN"
          [ -n "$SN_URL" ]           || missing="$missing SN_URL"
          [ -n "$SN_USER" ]          || missing="$missing SN_USER"
          [ -n "$SN_PASS" ]          || missing="$missing SN_PASS"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"

          # On a SCHEDULE, not being able to run is the failure.
          #
          # This job exists so that a ServiceNow-side change -- a renamed choice,
          # a revoked role, a deactivated plugin -- surfaces as an alert instead
          # of as a customer noticing the CMDB stopped updating. A scheduled run
          # that skips still reports success, so the alert can never fire and the
          # weekly green tick means nothing. That is the same shape as the bug
          # this workflow was written to catch: every layer reporting success
          # while nothing was verified.
          #
          # It had been skipping in exactly this way; SN_URL, SN_USER and SN_PASS
          # were never configured, and the run went green every Monday regardless.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "::error::The weekly ServiceNow assurance run cannot run:${missing} is not configured."
            echo "::error::A scheduled run that skips is a green tick for work nobody did — failing instead."
            exit 1
          fi

          # On demand, or from a fork, skipping is legitimate: whoever ran it may
          # simply not hold credentials to a shared instance.
          echo "::warning::ServiceNow e2e skipped —${missing} not set. Expected outside the scheduled run."

      - name: Run the live suite
        if: steps.creds.outputs.ready == 'true'
        env:
          FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          FIDES_FLOW_ID: ${{ vars.FIDES_FLOW_ID }}
          SN_URL: ${{ secrets.SN_URL }}
          SN_USER: ${{ secrets.SN_USER }}
          SN_PASS: ${{ secrets.SN_PASS }}
          KEEP: '1'
        run: ./scripts/servicenow-e2e.sh
