# Fides Gate — GitLab CI template.
#
# Gates a pipeline on a Fides compliance/provenance verdict, mirroring the
# GitHub Action at .github/actions/fides-gate. Include it with typed inputs:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/olafkfreund/fides/main/ci/gitlab/fides-gate.yml'
#       inputs:
#         command: change-gate
#         trail: "$TRAIL_ID"
#
# Set FIDES_API_TOKEN (masked, protected) and FIDES_SERVER_URL as CI/CD
# variables — never pass a token through an input.
#
# The job fails (exit 1) on a gate violation, exactly like every `fides` gate
# command exits 2. Set warn_only: true to downgrade a violation to a warning.

spec:
  inputs:
    command:
      description: 'change-gate | verify-image | verify-chain | env-verify'
    version:
      default: 'latest'
    cli_repo:
      default: 'olafkfreund/fides'
    stage:
      default: 'test'
    server_url:
      default: ''
    trail:
      default: ''
    sha256:
      default: ''
    policy:
      default: ''
    signer:
      default: ''
    issuer:
      default: ''
    key:
      default: ''
    env:
      default: ''
    mcp_server:
      default: ''
    tool:
      default: ''
    rule:
      default: ''
    args:
      default: ''
    warn_only:
      default: 'false'
---

fides-gate:
  stage: $[[ inputs.stage ]]
  image: alpine:3.20
  variables:
    IN_COMMAND: "$[[ inputs.command ]]"
    IN_VERSION: "$[[ inputs.version ]]"
    IN_CLI_REPO: "$[[ inputs.cli_repo ]]"
    IN_TRAIL: "$[[ inputs.trail ]]"
    IN_SHA256: "$[[ inputs.sha256 ]]"
    IN_POLICY: "$[[ inputs.policy ]]"
    IN_SIGNER: "$[[ inputs.signer ]]"
    IN_ISSUER: "$[[ inputs.issuer ]]"
    IN_KEY: "$[[ inputs.key ]]"
    IN_ENV: "$[[ inputs.env ]]"
    IN_MCP_SERVER: "$[[ inputs.mcp_server ]]"
    IN_TOOL: "$[[ inputs.tool ]]"
    IN_RULE: "$[[ inputs.rule ]]"
    IN_ARGS: "$[[ inputs.args ]]"
    IN_WARN_ONLY: "$[[ inputs.warn_only ]]"
    IN_SERVER_URL: "$[[ inputs.server_url ]]"
  script:
    - apk add --no-cache curl jq tar >/dev/null
    - '[ -n "$IN_SERVER_URL" ] && export FIDES_SERVER_URL="$IN_SERVER_URL" || true'
    - |
      set -eu
      goos=linux
      case "$(uname -m)" in
        x86_64) goarch=amd64 ;;
        aarch64|arm64) goarch=arm64 ;;
        *) echo "unsupported arch $(uname -m)"; exit 1 ;;
      esac
      ver="$IN_VERSION"
      if [ "$ver" = "latest" ]; then
        ver="$(curl -fsSL "https://api.github.com/repos/${IN_CLI_REPO}/releases/latest" | jq -r '.tag_name')"
      fi
      [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve fides version"; exit 1; }
      base="fides_${ver}_${goos}_${goarch}"
      url="https://github.com/${IN_CLI_REPO}/releases/download/${ver}"
      curl -fsSL "${url}/${base}.tar.gz"        -o "${base}.tar.gz"
      curl -fsSL "${url}/${base}.tar.gz.sha256" -o "${base}.tar.gz.sha256"
      sha256sum -c "${base}.tar.gz.sha256"
      tar -xzf "${base}.tar.gz"
      fides="./${base}/fides"; chmod +x "$fides"

      set --
      case "$IN_COMMAND" in
        change-gate)  set -- change-gate --trail "$IN_TRAIL" ;;
        verify-chain) set -- verify-chain --trail "$IN_TRAIL" ;;
        assert)       set -- assert --sha256 "$IN_SHA256" --policy "$IN_POLICY" ;;
        verify-image)
          set -- verify-image --sha256 "$IN_SHA256"
          [ -n "$IN_SIGNER" ] && set -- "$@" --signer "$IN_SIGNER" || true
          [ -n "$IN_ISSUER" ] && set -- "$@" --issuer "$IN_ISSUER" || true
          [ -n "$IN_KEY" ]    && set -- "$@" --key "$IN_KEY" || true
          [ -n "$IN_TRAIL" ]  && set -- "$@" --trail "$IN_TRAIL" || true
          ;;
        env-verify)   set -- env verify --env "$IN_ENV" --server "$IN_MCP_SERVER" --tool "$IN_TOOL" --rule "$IN_RULE" ;;
        *) echo "unknown command '$IN_COMMAND'"; exit 1 ;;
      esac
      [ -n "$IN_ARGS" ] && set -- "$@" $IN_ARGS || true

      set +e
      "$fides" "$@"; code=$?
      set -e
      if [ "$code" = "0" ]; then echo "PASS"; exit 0; fi
      if [ "$code" = "2" ]; then
        if [ "$IN_WARN_ONLY" = "true" ]; then echo "VIOLATION (warn-only)"; exit 0; fi
        echo "VIOLATION — gate blocked"; exit 1
      fi
      echo "ERROR running fides (exit $code)"; exit "$code"
